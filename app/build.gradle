plugins {
    id 'com.android.application'
}

android {
    compileSdk 34
    namespace 'com.DCPC.Injector.WR'

    defaultConfig {
        applicationId "com.DCPC.Injector.WR"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
        ndk { abiFilters 'arm64-v8a' }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    sourceSets {
        main {
            assets.srcDirs  = ['src/main/assets']
            jniLibs.srcDirs = ['src/main/lib']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
